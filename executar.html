<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Executando exercício</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 0 16px; }
    pre { background: #f2f2f2; padding: 12px; border-radius: 6px; white-space: pre-wrap; }
    button, a { font-size: 16px; padding: 6px 10px; margin-right: 8px; }
  </style>
</head>
<body>
  <h2 id="titulo"></h2>
  <pre id="saida"></pre>
  <button onclick="location.reload()">Executar de novo</button>
  <a href="index.html">Voltar à lista</a>

  <script>
    // faz o console.log também escrever na página
    var saida = document.getElementById("saida");
    var logOriginal = console.log;
    console.log = function (texto) {
      saida.innerHTML = saida.innerHTML + texto + "\n";
      logOriginal(texto);
    };

    // descobre qual exercício carregar (vem no endereço da página)
    var arquivo = window.location.search.replace("?arquivo=", "");
    document.getElementById("titulo").innerHTML = arquivo;

    var script = document.createElement("script");
    script.src = arquivo;
    document.body.appendChild(script);
  </script>
</body>
</html>
